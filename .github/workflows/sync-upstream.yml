name: Sync upstream

on:
  schedule:
    # Runs daily at 04:20 Asia/Shanghai (20:20 UTC).
    - cron: '20 20 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "AGENTS.md"

permissions:
  contents: read

# Serialize sync and deployment runs; never interrupt a production deploy.
concurrency:
  group: cloudssh-upstream-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    # Scheduled sync is enabled automatically on forks. Manual sync is restricted to main.
    if: >-
      github.event.repository.fork == true &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.CLOUDSSH_SYNC_APP_ID }}
          private-key: ${{ secrets.CLOUDSSH_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: CloudSSH
          permission-contents: write
          permission-workflows: write

      - name: Sync main branch from upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! response=$(gh api \
            --method POST \
            "repos/${REPOSITORY}/merge-upstream" \
            -f branch=main 2>"$error_file"); then
            cat "$error_file" >&2
            echo "::error title=上游同步失败::GitHub 拒绝同步请求；不会自动选择冲突版本，也不会部署未同步代码。"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：同步失败，main 未能完成上游合并"
              echo "- 处理：检查冲突路径或 GitHub App 权限；同步失败不会触发生产部署"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ -s "$error_file" ]]; then
            cat "$error_file" >&2
          fi
          rm -f "$error_file"
          trap - EXIT

          merge_type=$(jq -r '.merge_type // "unknown"' <<< "$response")
          base_branch=$(jq -r '.base_branch // "unknown"' <<< "$response")
          case "$merge_type" in
            none)
              result="当前 main 分支未落后于上游，无需同步"
              ;;
            fast-forward|merge)
              result="已成功同步上游更新"
              ;;
            *)
              result="GitHub 已完成同步请求"
              ;;
          esac

          echo "上游分支：${base_branch}"
          echo "同步结果：${result}"
          echo "::notice title=上游同步::${result}"
          {
            echo "## 上游同步结果"
            echo
            echo "- 上游分支：\`${base_branch}\`"
            echo "- 状态：${result}"
            echo "- 若 main 有新提交，后续 push 运行会先完成验证，再部署生产 Worker"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-and-deploy:
    name: Verify fork and deploy tested source
    if: >-
      github.repository == 'xiongmx/CloudSSH' &&
      ((github.event_name == 'pull_request' && github.base_ref == 'main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Validate Wrangler deployment configuration
        run: pnpm exec wrangler deploy --dry-run --env=""

      - name: Select browser test profile
        id: e2e-profile
        run: node scripts/ci-test-e2e.mjs

      # Fail inexpensive checks and the build before downloading browser binaries.
      - name: Install Playwright browser
        if: steps.e2e-profile.outputs.profile != 'skip' && steps.e2e-profile.outputs.profile != 'chromium'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Install Playwright Chromium (reduced test profile)
        if: steps.e2e-profile.outputs.profile == 'chromium'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E and accessibility tests
        id: e2e
        if: steps.e2e-profile.outputs.profile != 'skip' && steps.e2e-profile.outputs.profile != 'chromium'
        run: pnpm run test:e2e

      - name: Browser E2E and accessibility tests (Chromium only)
        id: e2e-chromium
        if: steps.e2e-profile.outputs.profile == 'chromium'
        run: pnpm run test:e2e --project=chromium

      - name: Upload browser test reports
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure' || steps.e2e-chromium.outcome == 'success' || steps.e2e-chromium.outcome == 'failure') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Deploy verified artifact (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error title=缺少 Cloudflare 部署凭据::请在仓库 Actions secrets 配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。"
            exit 1
          fi
          pnpm exec wrangler deploy --env=""
